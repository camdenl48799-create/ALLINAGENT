[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allinagent"
version = "0.3.0"
description = "ALLINAGENT — its own local-first AI coding agent (local brain + optional LLM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ALLINAGENT contributors" }]
keywords = ["ai", "agent", "coding", "llm", "local-first", "allinagent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.40.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = ["openai>=1.40.0"]

[project.scripts]
allinagent = "allinagent.cli:main"

[project.urls]
Homepage = "https://github.com/camdenl48799-create/ALLINAGENT"
Repository = "https://github.com/camdenl48799-create/ALLINAGENT"

[tool.setuptools.packages.find]
include = ["allinagent*"]
