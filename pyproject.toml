[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allinagent"
version = "0.1.0"
description = "A local-first AI coding agent"
requires-python = ">=3.10"

[project.scripts]
allinagent = "allinagent.cli:main"

[tool.setuptools.packages.find]
include = ["allinagent*"]
