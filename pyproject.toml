[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allinagent"
version = "1.8.0"
description = "An independent, local-first AI coding agent"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
llm = ["openai>=1.0"]

[project.scripts]
allinagent = "allinagent.cli:main"

[tool.setuptools.packages.find]
include = ["allinagent*"]
