[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allinagent"
version = "0.2.0"
description = "Local-first AI coding agent with real tool calling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ALLINAGENT contributors" }]
keywords = ["ai", "agent", "coding", "llm", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
allinagent = "allinagent.cli:main"

[project.urls]
Homepage = "https://github.com/camdenl48799-create/ALLINAGENT"
Repository = "https://github.com/camdenl48799-create/ALLINAGENT"

[tool.setuptools.packages.find]
include = ["allinagent*"]
